{# Minimal stroke icon set — 16px grid, 1.8px stroke, currentColor. #}
{% macro icon(name, size=14) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 16 16" fill="none"
     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "check" -%}
  <path d="M2.5 8.5l4 4 7-9"/>
{%- elif name == "x" -%}
  <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/>
{%- elif name == "info" -%}
  <circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4"/><path d="M8 4.8v.01"/>
{%- elif name == "print" -%}
  <path d="M4.5 6V2.5h7V6"/><rect x="2.5" y="6" width="11" height="5" rx="0.5"/><path d="M4.5 9.5h7v4h-7z"/>
{%- elif name == "sparkle" -%}
  <path d="M8 2l1.2 3.6L13 7l-3.8 1.4L8 12 6.8 8.4 3 7l3.8-1.4z"/><path d="M12.8 11.5l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z"/>
{%- elif name == "plus" -%}
  <path d="M8 3v10M3 8h10"/>
{%- elif name == "sync" -%}
  <path d="M13 8a5 5 0 1 1-1.5-3.5"/><path d="M13 2.5V5h-2.5"/>
{%- elif name == "trash" -%}
  <path d="M3 4.5h10M6.5 4.5v-2h3v2M4.5 4.5l.7 9h5.6l.7-9"/>
{%- elif name == "up" -%}
  <path d="M4 10l4-5 4 5"/>
{%- elif name == "down" -%}
  <path d="M4 6l4 5 4-5"/>
{%- elif name == "updown" -%}
  <path d="M5 6l3-3.5L11 6M5 10l3 3.5 3-3.5"/>
{%- elif name == "left" -%}
  <path d="M10 3l-5 5 5 5"/>
{%- elif name == "right" -%}
  <path d="M6 3l5 5-5 5"/>
{%- elif name == "external" -%}
  <path d="M6.5 3H3v10h10V9.5"/><path d="M9 3h4v4"/><path d="M13 3L7.5 8.5"/>
{%- endif -%}
</svg>
{%- endmacro %}
