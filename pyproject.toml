[project]
name = "record-collection"
version = "0.1.0"
description = "Mirror a Discogs collection; organize crates, print labels"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "brother-ql-next>=0.12",
    "pyusb>=1.2",
    "flask>=3.1.3",
    "pillow>=12.3.0",
    "segno>=1.6.6",
]

[project.scripts]
records = "lib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
